<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | De Handels Club</title>
  <meta name="description" content="Inzichten over bedrijfsoverdrachten, vastgoed en ondernemen van De Handels Club.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #0d1b2a;
      --gold: #c9a84c;
      --light: #f5f5f0;
      --gray: #888;
    }
    body { background: var(--navy); color: white; font-family: 'Georgia', serif; }

    header {
      border-bottom: 1px solid #ffffff15;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--gold); font-size: 14px;
    }
    .logo-text { color: white; font-size: 16px; font-weight: 600; letter-spacing: 1px; }
    .logo-sub { color: var(--gold); font-size: 10px; letter-spacing: 3px; display: block; }
    nav a { color: var(--gray); text-decoration: none; margin-left: 24px; font-size: 14px; font-family: sans-serif; }
    nav a:hover { color: var(--gold); }

    .hero {
      text-align: center;
      padding: 80px 40px 60px;
      border-bottom: 1px solid #ffffff10;
    }
    .hero-label {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
      font-family: sans-serif;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 16px;
      color: white;
    }
    .hero p {
      color: var(--gray);
      font-size: 16px;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.7;
      font-family: sans-serif;
    }

    .posts {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 40px;
    }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 32px;
    }
    .post-card {
      border: 1px solid #ffffff15;
      border-radius: 4px;
      overflow: hidden;
      transition: border-color 0.2s;
      text-decoration: none;
      display: block;
    }
    .post-card:hover { border-color: var(--gold); }
    .post-card img {
      width: 100%; height: 200px; object-fit: cover;
      display: block;
    }
    .post-card-body { padding: 24px; }
    .post-cat {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
      font-family: sans-serif;
      margin-bottom: 10px;
    }
    .post-card h2 {
      color: white;
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .post-card p {
      color: var(--gray);
      font-size: 14px;
      line-height: 1.6;
      font-family: sans-serif;
      margin-bottom: 16px;
    }
    .post-meta {
      color: #555;
      font-size: 12px;
      font-family: sans-serif;
    }
    .no-posts {
      text-align: center;
      color: var(--gray);
      font-family: sans-serif;
      padding: 60px 0;
    }

    footer {
      border-top: 1px solid #ffffff10;
      padding: 32px 40px;
      text-align: center;
      color: #444;
      font-size: 13px;
      font-family: sans-serif;
    }
    footer a { color: var(--gold); text-decoration: none; }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .hero { padding: 50px 20px 40px; }
      .hero h1 { font-size: 28px; }
      .posts { padding: 40px 20px; }
      .posts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-ring">HC</div>
    <div>
      <span class="logo-text">De Handels Club</span>
      <span class="logo-sub">INZICHTEN & NIEUWS</span>
    </div>
  </a>
  <nav>
    <a href="https://dehandelsclub.nl">← Hoofdsite</a>
    <a href="https://portaal.dehandelsclub.nl">Portaal</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-label">BLOG</div>
  <h1>Inzichten & Nieuws</h1>
  <p>Kennis over bedrijfsoverdrachten, vastgoed, netwerken en exclusief ondernemen.</p>
</div>

<div class="posts">
  <div class="posts-grid" id="postsGrid">
    <div class="no-posts">Eerste artikel komt binnenkort...</div>
  </div>
</div>

<footer>
  &copy; 2026 De Handels Club &nbsp;|&nbsp; <a href="https://dehandelsclub.nl">dehandelsclub.nl</a>
</footer>

<script>
  // Posts worden later dynamisch geladen via Netlify CMS
</script>

</body>
</html>
