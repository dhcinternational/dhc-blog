<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | De Handels Club</title>
  <meta name="description" content="Inzichten over bedrijfsoverdrachten, vastgoed, netwerken en exclusief ondernemen van De Handels Club.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #0d1b2a;
      --gold: #c9a84c;
      --light: #f5f5f0;
      --gray: #888;
    }
    body { background: var(--navy); color: white; font-family: 'Georgia', serif; }
    header {
      border-bottom: 1px solid #ffffff15;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--gold); font-size: 14px;
    }
    .logo-text { color: white; font-size: 16px; font-weight: 600; letter-spacing: 1px; }
    .logo-sub { color: var(--gold); font-size: 10px; letter-spacing: 3px; display: block; }
    nav a { color: var(--gray); text-decoration: none; margin-left: 24px; font-size: 14px; font-family: sans-serif; }
    nav a:hover { color: var(--gold); }
    .hero {
      text-align: center;
      padding: 80px 40px 60px;
      border-bottom: 1px solid #ffffff10;
    }
    .hero-label { color: var(--gold); font-size: 11px; letter-spacing: 4px; font-family: sans-serif; margin-bottom: 16px; }
    .hero h1 { font-size: 42px; font-weight: 400; margin-bottom: 16px; }
    .hero p { color: var(--gray); font-size: 16px; font-family: sans-serif; }
    .posts { padding: 60px 40px; max-width: 1100px; margin: 0 auto; }
    .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; }
    .post-card {
      background: #ffffff08;
      border: 1px solid #ffffff12;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: border-color 0.2s;
    }
    .post-card:hover { border-color: var(--gold); }
    .post-card img { width: 100%; height: 200px; object-fit: cover; }
    .post-card-body { padding: 24px; }
    .post-cat { color: var(--gold); font-size: 11px; letter-spacing: 3px; font-family: sans-serif; margin-bottom: 8px; }
    .post-title { font-size: 20px; font-weight: 400; margin-bottom: 12px; line-height: 1.4; }
    .post-summary { color: var(--gray); font-size: 14px; font-family: sans-serif; line-height: 1.6; }
    .post-date { color: #555; font-size: 12px; font-family: sans-serif; margin-top: 16px; }
    .no-posts { color: var(--gray); font-family: sans-serif; text-align: center; padding: 60px; }
    footer {
      text-align: center;
      padding: 32px 40px;
      color: #444;
      font-size: 13px;
      font-family: sans-serif;
    }
    footer a { color: var(--gold); text-decoration: none; }
    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .hero { padding: 50px 20px 40px; }
      .hero h1 { font-size: 28px; }
      .posts { padding: 40px 20px; }
      .posts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <a href="/" class="logo">
    <div class="logo-ring">HC</div>
    <div>
      <span class="logo-text">De Handels Club</span>
      <span class="logo-sub">INZICHTEN & NIEUWS</span>
    </div>
  </a>
  <nav>
    <a href="https://dehandelsclub.nl">← Hoofdsite</a>
    <a href="https://portaal.dehandelsclub.nl">Portaal</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-label">BLOG</div>
  <h1>Inzichten & Nieuws</h1>
  <p>Kennis over bedrijfsoverdrachten, vastgoed, netwerken en exclusief ondernemen.</p>
</div>

<div class="posts">
  <div class="posts-grid" id="postsGrid">
    <div class="no-posts">Artikelen worden geladen...</div>
  </div>
</div>

<footer>
  &copy; 2026 De Handels Club &nbsp;|&nbsp; <a href="https://dehandelsclub.nl">dehandelsclub.nl</a>
</footer>

<script>
async function laadArtikelen() {
  const grid = document.getElementById('postsGrid');
  try {
    const response = await fetch('https://api.github.com/repos/dhcinternational/dhc-blog/contents/posts');
    const files = await response.json();
    const mdFiles = files.filter(f => f.name.endsWith('.md'));
    if (mdFiles.length === 0) {
      grid.innerHTML = '<div class="no-posts">Eerste artikel komt binnenkort...</div>';
      return;
    }
    const artikelen = await Promise.all(mdFiles.map(async f => {
      const res = await fetch(f.download_url);
      const tekst = await res.text();
      return parseerMarkdown(tekst, f.name);
    }));
    artikelen.sort((a, b) => new Date(b.datum) - new Date(a.datum));
    grid.innerHTML = artikelen.map(a => `
      <a class="post-card" href="posts/${a.slug}.html">
        ${a.foto ? `<img src="${a.foto}" alt="${a.titel}">` : ''}
        <div class="post-card-body">
          <div class="post-cat">${a.categorie || 'NIEUWS'}</div>
          <div class="post-title">${a.titel}</div>
          <div class="post-summary">${a.samenvatting || ''}</div>
          <div class="post-date">${formatDatum(a.datum)}</div>
        </div>
      </a>
    `).join('');
  } catch(e) {
    grid.innerHTML = '<div class="no-posts">Artikelen konden niet worden geladen.</div>';
  }
}

function parseerMarkdown(tekst, bestandsnaam) {
  const frontmatterMatch = tekst.match(/^---\n([\s\S]*?)\n---/);
  const data = {};
  if (frontmatterMatch) {
    frontmatterMatch[1].split('\n').forEach(regel => {
      const [sleutel, ...waarde] = regel.split(':');
      if (sleutel) data[sleutel.trim()] = waarde.join(':').trim().replace(/^["']|["']$/g, '');
    });
  }
  return {
    titel: data.title || data.titel || bestandsnaam,
    datum: data.date || data.datum || '',
    categorie: (data.categorie || data.category || '').toUpperCase(),
    samenvatting: data.samenvatting || data.summary || data.description || '',
    foto: data.omslagfoto || data.coverImage || data.foto || '',
    slug: bestandsnaam.replace('.md', '')
  };
}

function formatDatum(datum) {
  if (!datum) return '';
  try {
    return new Date(datum).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) { return datum; }
}

laadArtikelen();
</script>
</body>
</html>
